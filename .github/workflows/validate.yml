name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate repository
        shell: pwsh
        run: ./scripts/Test-Repository.ps1 -RunDiagnosticsSmokeTest
